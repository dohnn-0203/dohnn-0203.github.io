<svg xmlns="http://www.w3.org/2000/svg" width="640" height="560" viewBox="0 0 640 560" fill="none" role="img" aria-labelledby="wind-title wind-desc">
  <title id="wind-title">Floating wind, connected systems</title>
  <desc id="wind-desc">An original engineering illustration of three floating offshore wind turbines. An isometric ocean grid reveals their floating foundations and mooring lines connected to seabed anchors.</desc>
  <defs>
    <linearGradient id="water" x1="320" y1="150" x2="320" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#edf4ff" stop-opacity=".05"/>
      <stop offset=".58" stop-color="#dceaff" stop-opacity=".74"/>
      <stop offset="1" stop-color="#cddfff" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="tower" x1="-6" y1="0" x2="7" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c7daff"/>
    </linearGradient>
    <linearGradient id="column" x1="-12" y1="0" x2="12" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#eff5ff"/>
      <stop offset="1" stop-color="#bad2ff"/>
    </linearGradient>
    <clipPath id="ocean-clip">
      <path d="M29 281 311 140 615 286 333 440Z"/>
    </clipPath>
    <g id="anchor">
      <path d="M-7 0 0-3.5 7 0 0 3.5Z" fill="#dce9ff" stroke="#2655eb" stroke-width="1"/>
      <path d="M0-5V0" stroke="#2655eb" stroke-width="1.4"/>
    </g>
    <g id="float">
      <path d="M-12-2V17C-12 24 12 24 12 17V-2Z" fill="url(#column)" stroke="#2655eb" stroke-width="1.2"/>
      <ellipse cy="-2" rx="12" ry="5.8" fill="#fff" stroke="#2655eb" stroke-width="1.2"/>
      <path d="M-12 10C-7 16 7 16 12 10" stroke="#2655eb" stroke-width="1" opacity=".42"/>
      <path d="M-9 1V12" stroke="#fff" stroke-width="2"/>
    </g>
    <g id="foundation">
      <path d="M-37 11 16-17 36 25Z" fill="#e5eeff" fill-opacity=".72" stroke="#2655eb" stroke-width="1.2"/>
      <path d="M-37 11 0 0 16-17M0 0 36 25" stroke="#2655eb" stroke-width="5.5" stroke-linejoin="round"/>
      <path d="M-37 9 0-2 16-19M0-2 36 23" stroke="#f8fbff" stroke-width="2" stroke-linejoin="round"/>
      <use href="#float" transform="translate(16 -17)"/>
      <use href="#float" transform="translate(-37 11)"/>
      <use href="#float" transform="translate(36 25)"/>
      <path d="M-7-5V8C-7 12 7 12 7 8V-5Z" fill="#c4d8ff" stroke="#2655eb" stroke-width="1.2"/>
      <ellipse cy="-5" rx="7" ry="3.5" fill="#fff" stroke="#2655eb" stroke-width="1.2"/>
    </g>
    <path id="blade" d="M-3-7-1-32 4-94Q5-100 7-100L10-27 4-7Z" fill="#fff" stroke="#2655eb" stroke-width="1.1" stroke-linejoin="round"/>
    <g id="turbine">
      <path d="M-6 0-2-159H3L7 0C4 4-4 4-6 0Z" fill="url(#tower)" stroke="#2655eb" stroke-width="1.15"/>
      <path d="M0-144 2-9" stroke="#d5e4ff" stroke-width="1"/>
      <path d="M-3-166 12-169 20-165V-158L2-155-3-159Z" fill="#152036"/>
      <path d="M0-166 12-168 19-165 5-162Z" fill="#5071a9"/>
      <g transform="translate(-3 -162)">
        <use href="#blade"/>
        <use href="#blade" transform="rotate(120)"/>
        <use href="#blade" transform="rotate(240)"/>
        <circle r="7" fill="#fff" stroke="#2655eb" stroke-width="1.3"/>
        <circle r="2.2" fill="#2655eb"/>
      </g>
    </g>
  </defs>

  <!-- Quiet sea surface: a perspective grid, not a UI screenshot. -->
  <path d="M29 281 311 140 615 286 333 440Z" fill="url(#water)"/>
  <g clip-path="url(#ocean-clip)" stroke="#2655eb" stroke-width=".7" opacity=".12">
    <path d="M-96 270 363 493M-61 252 398 475M-26 235 433 458M9 217 468 440M44 200 503 423M79 182 538 405M114 165 573 388M149 147 608 370M184 130 643 353M219 112 678 335M254 95 713 318M289 77 748 300"/>
    <path d="M-71 331 417 87M-35 348 453 104M1 365 489 121M37 382 525 138M73 399 561 155M109 416 597 172M145 433 633 189M181 450 669 206M217 467 705 223M253 484 741 240M289 501 777 257"/>
  </g>
  <path d="M29 281 333 440 615 286" stroke="#2655eb" stroke-width="1" opacity=".16"/>
  <path d="M29 281 311 140 615 286" stroke="#2655eb" stroke-width=".8" stroke-dasharray="3 6" opacity=".17"/>

  <!-- Mooring cables continue beneath the water plane. -->
  <g stroke="#5278c6" stroke-width="1.15" stroke-linecap="round">
    <path d="M148 277Q142 324 99 354M184 257Q215 305 252 319M198 287Q203 333 180 377"/>
    <path d="M310 225Q288 269 270 290M345 207Q375 241 403 260M359 236Q369 284 358 304"/>
    <path d="M390 356Q378 410 321 457M449 325Q507 365 554 403M471 370Q492 421 483 486" stroke-width="1.5"/>
  </g>
  <g opacity=".72">
    <use href="#anchor" transform="translate(99 354)"/>
    <use href="#anchor" transform="translate(252 319)"/>
    <use href="#anchor" transform="translate(180 377)"/>
    <use href="#anchor" transform="translate(270 290)"/>
    <use href="#anchor" transform="translate(403 260)"/>
    <use href="#anchor" transform="translate(358 304)"/>
    <use href="#anchor" transform="translate(321 457) scale(1.2)"/>
    <use href="#anchor" transform="translate(554 403) scale(1.2)"/>
    <use href="#anchor" transform="translate(483 486) scale(1.2)"/>
  </g>

  <!-- Surface contours around each floating foundation. -->
  <g stroke="#2655eb" stroke-width="1" opacity=".2">
    <path d="M122 281C97 264 147 246 188 254M213 268C240 288 177 307 145 298"/>
    <path d="M109 285C81 266 122 245 152 244M217 261C262 288 201 314 161 310" opacity=".5"/>
    <path d="M289 229C267 215 311 198 348 206M374 217C400 235 349 252 318 245"/>
    <path d="M365 361C327 337 392 304 439 316M486 341C534 365 451 399 403 385"/>
    <path d="M348 367C306 339 351 313 387 304M499 331C567 365 478 411 421 404" opacity=".6"/>
    <path d="M360 391C390 409 431 418 463 411" opacity=".45"/>
  </g>

  <!-- Backmost tower. -->
  <g transform="translate(334 218) scale(.65)">
    <use href="#foundation"/>
    <use href="#turbine"/>
  </g>

  <!-- Near-left tower. -->
  <g transform="translate(173 269) scale(.71)">
    <use href="#foundation"/>
    <use href="#turbine"/>
  </g>

  <!-- Foreground turbine and triangular semi-submersible support. -->
  <g transform="translate(431 338) scale(1.1)">
    <use href="#foundation"/>
    <use href="#turbine"/>
  </g>

  <!-- Subtle bathymetric and surveying marks. -->
  <g stroke="#2655eb" stroke-width="1" opacity=".18">
    <path d="M78 406C119 387 139 394 171 409S228 440 267 424"/>
    <path d="M67 420C117 397 139 407 171 422S225 455 270 439" opacity=".6"/>
    <path d="M80 436C124 415 143 423 174 438" opacity=".35"/>
    <path d="M539 258h10m-5-5v10M80 244h10m-5-5v10M289 473h10m-5-5v10"/>
  </g>
  <g fill="#2655eb" opacity=".5">
    <circle cx="61" cy="297" r="2"/>
    <circle cx="581" cy="303" r="2"/>
    <circle cx="333" cy="440" r="2"/>
  </g>
</svg>
